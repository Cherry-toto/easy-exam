<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试详情 - 在线考试系统</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/fontawesome-free-6.7.2/css/all.min.css" rel="stylesheet">
    <script src="/static/js/jquery.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .back-button {
            transition: all 0.3s ease;
        }
        .back-button:hover {
            transform: translateX(-3px);
        }
        .question-item {
            transition: transform 0.2s ease;
        }
        .question-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <button onclick="window.location.href='/user.html'" class="back-button text-gray-600 hover:text-purple-600 p-2 mr-2">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <span class="font-bold text-lg">考试详情</span>
                </div>
                <button id="logoutBtn" onclick="showLogoutModal()" class="text-red-600 hover:text-red-800 p-2">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- 考试信息卡片 -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <h2 id="examDetailTitle" class="text-2xl font-bold text-gray-800 mb-4"></h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm mb-4">
                <div class="text-center p-3 bg-blue-50 rounded-lg">
                    <div class="text-2xl font-bold text-blue-600" id="examDetailScore"></div>
                    <div class="text-gray-600">得分</div>
                </div>
                <div class="text-center p-3 bg-green-50 rounded-lg">
                    <div class="text-2xl font-bold text-green-600" id="examDetailUseTime"></div>
                    <div class="text-gray-600">用时</div>
                </div>
                <div class="text-center p-3 bg-red-50 rounded-lg">
                    <div class="text-2xl font-bold text-red-600" id="examDetailMistakeCount"></div>
                    <div class="text-gray-600">错题</div>
                </div>
            </div>
            <div class="text-sm text-gray-500" id="examDetailCreateTime"></div>
        </div>

        <!-- 题目列表 -->
        <div id="examDetailContent" class="bg-white rounded-lg shadow-sm p-6">
            <div class="text-center py-12">
                <i class="fas fa-spinner fa-spin text-3xl text-gray-400 mb-4"></i>
                <p class="text-gray-500">加载中...</p>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 md:hidden">
        <div class="flex justify-around py-3">
            <a href="/index.php" class="bottom-nav-link text-center py-2 px-4" data-tab="home">
                <i class="fas fa-home text-2xl"></i>
                <span class="hidden">首页</span>
            </a>
            <a href="/exam-list.html" class="bottom-nav-link text-center py-2 px-4" data-tab="exam">
                <i class="fas fa-list-alt text-2xl"></i>
                <span class="hidden">试卷</span>
            </a>
            <a href="/user.html" class="bottom-nav-link text-center py-2 px-4 nav-active" data-tab="user">
                <i class="fas fa-user text-2xl"></i>
                <span class="hidden">个人中心</span>
            </a>
        </div>
    </div>

    <!-- 退出确认模态框 -->
    <div id="logoutModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-auto">
            <div class="text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-exclamation-triangle text-red-600 text-2xl"></i>
                </div>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">确认退出</h3>
                <p class="text-sm text-gray-600 mb-4">确定要退出当前账号吗？</p>
                <div class="flex space-x-3">
                    <button onclick="hideLogoutModal()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        取消
                    </button>
                    <button onclick="logout()" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                        确定退出
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // 检查登录状态
            checkLoginStatus();
            
            // 获取URL参数中的exam_log_id
            const examLogId = getUrlParam('exam_log_id');
            if (!examLogId) {
                $('#examDetailContent').html(`
                    <div class="text-center py-12">
                        <i class="fas fa-exclamation-circle text-4xl text-red-300 mb-3"></i>
                        <p class="text-red-500">缺少考试记录ID</p>
                        <p class="text-sm text-gray-400 mt-2">请从考试记录列表进入</p>
                    </div>
                `);
                return;
            }
            
            // 加载考试详情
            loadExamDetail(examLogId);
        });

        // 获取URL参数
        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        // 检查登录状态
        function checkLoginStatus() {
            $.ajax({
                url: '/checklogin.php',
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    if (!response.logged_in) {
                        window.location.href = '/login.html';
                    } else {
                        // 存储用户ID
                        window.userId = response.user.id;
                    }
                },
                error: function() {
                    window.location.href = '/login.html';
                }
            });
        }

        // 加载考试详情
        function loadExamDetail(exam_log_id) {
            $('#examDetailContent').html(`
                <div class="text-center py-12">
                    <i class="fas fa-spinner fa-spin text-3xl text-gray-400 mb-4"></i>
                    <p class="text-gray-500">加载中...</p>
                </div>
            `);

            $.ajax({
                url: '/api-exam-detail.php',
                type: 'GET',
                data: {
                    exam_log_id: exam_log_id
                },
                dataType: 'json',
                success: function(response) {
                    if (response.success && response.data) {
                        const examDetail = response.data;
                        
                        // 填充头部信息
                        $('#examDetailTitle').text(examDetail.exam_title);
                        $('#examDetailScore').text(examDetail.score + '分');
                        $('#examDetailUseTime').text(formatTime(examDetail.use_time));
                        $('#examDetailMistakeCount').text(examDetail.mistake_count);
                        $('#examDetailCreateTime').text('考试时间：' + formatDateTime(examDetail.create_time));
                        
                        // 填充题目列表
                        let questionsHtml = '';
                        examDetail.questions.forEach((question, index) => {
                            const questionNumber = index + 1;
                            const isMistake = question.is_mistake;
                            const questionClass = isMistake ? 'border-l-4 border-red-500 pl-3' : '';
                            const mistakeBadge = isMistake ? '<span class="inline-block bg-red-100 text-red-800 text-xs px-2 py-1 rounded-full ml-2">错题</span>' : '';
                            
                            // 构建选项HTML
                            let optionsHtml = '';
                            for (const [key, value] of Object.entries(question.options)) {
                                const isAnswer = question.answer.includes(key);
                                const isUserChoice = question.user_answer.includes(key);
                                let optionClass = '';
                                let optionBadge = '';
                                
                                if (isMistake) {
                                    if (isAnswer && !isUserChoice) {
                                        optionClass = 'bg-green-100 border-green-500';
                                        optionBadge = '<span class="text-green-600 ml-1">正确</span>';
                                    } else if (!isAnswer && isUserChoice) {
                                        optionClass = 'bg-red-100 border-red-500';
                                        optionBadge = '<span class="text-red-600 ml-1">错误</span>';
                                    }
                                } else if (isAnswer) {
                                    optionClass = 'bg-green-50 border-green-500';
                                }
                                
                                optionsHtml += `
                                    <div class="option-item border px-4 py-2 mb-2 rounded-md ${optionClass}">
                                        <span class="font-semibold mr-2">${key}.</span> ${value}${optionBadge}
                                    </div>
                                `;
                            }
                            
                            // 构建解析HTML
                            const analysisHtml = question.analysis ? `
                                <div class="analysis mt-3 p-3 bg-blue-50 rounded-md">
                                    <div class="font-semibold text-blue-800 mb-1">解析：</div>
                                    <div class="text-blue-700 text-sm">${question.analysis}</div>
                                </div>
                            ` : '';
                            
                            // 构建题目HTML
                            questionsHtml += `
                                <div class="question-item mb-8 pb-6 border-b border-gray-200 last:border-0">
                                    <div class="question-header mb-3 flex items-start">
                                        <div class="font-bold text-lg text-gray-800">${questionNumber}. </div>
                                        <div class="flex-1 ${questionClass}">
                                            ${question.title}
                                            ${mistakeBadge}
                                        </div>
                                    </div>
                                    <div class="options mb-3">
                                        ${optionsHtml}
                                    </div>
                                    <div class="answer-info mb-2">
                                        <div class="font-semibold text-gray-700">正确答案：</div>
                                        <div class="text-gray-800">${question.answer}</div>
                                    </div>
                                    ${analysisHtml}
                                </div>
                            `;
                        });
                        
                        $('#examDetailContent').html(questionsHtml);
                    } else {
                        $('#examDetailContent').html(`
                            <div class="text-center py-12">
                                <i class="fas fa-exclamation-circle text-4xl text-red-300 mb-3"></i>
                                <p class="text-red-500">${response.message || '获取考试详情失败'}</p>
                                <p class="text-sm text-gray-400 mt-2">请稍后重试</p>
                            </div>
                        `);
                    }
                },
                error: function() {
                    $('#examDetailContent').html(`
                        <div class="text-center py-12">
                            <i class="fas fa-exclamation-circle text-4xl text-red-300 mb-3"></i>
                            <p class="text-red-500">网络错误，请稍后重试</p>
                        </div>
                    `);
                }
            });
        }

        // 格式化时间（秒转分秒）
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}分${secs}秒`;
        }

        // 格式化日期时间
        function formatDateTime(datetime) {
            const date = new Date(datetime);
            return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        }

        // 显示退出确认模态框
        function showLogoutModal() {
            $('#logoutModal').removeClass('hidden').addClass('flex');
        }

        // 隐藏退出确认模态框
        function hideLogoutModal() {
            $('#logoutModal').addClass('hidden').removeClass('flex');
        }

        // 退出登录
        function logout() {
            $.ajax({
                url: '/loginOut.php',
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    // 清除所有cookie
                    document.cookie = 'user_email=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    document.cookie = 'user_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    document.cookie = 'login_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    window.location.href = '/login.html';
                }
            });
        }
    </script>
</body>
</html>
